<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-labelledby="title desc">
  <title id="title">The compass pipeline</title>
  <desc id="desc">Org documents, models, C++ and SQL are read from git, parsed once into a content-addressed store shared by every worktree, and handed to codecs that produce output files or diagnostics.</desc>
  <rect width="860" height="300" fill="#fbf7ee"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#2b3a4a">
    <text x="90" y="34" font-size="15" font-weight="bold" text-anchor="middle">Checkout</text>
    <g font-size="13">
      <rect x="20" y="50" width="140" height="34" rx="6" fill="#e9dfc7" stroke="#2b3a4a"/>
      <text x="90" y="72" text-anchor="middle">org documents</text>
      <rect x="20" y="94" width="140" height="34" rx="6" fill="#e9dfc7" stroke="#2b3a4a"/>
      <text x="90" y="116" text-anchor="middle">codegen models</text>
      <rect x="20" y="138" width="140" height="34" rx="6" fill="#e9dfc7" stroke="#2b3a4a"/>
      <text x="90" y="160" text-anchor="middle">C++ and CMake</text>
      <rect x="20" y="182" width="140" height="34" rx="6" fill="#e9dfc7" stroke="#2b3a4a"/>
      <text x="90" y="204" text-anchor="middle">SQL</text>
      <text x="90" y="246" text-anchor="middle" font-size="12" font-style="italic">read through git's index,</text>
      <text x="90" y="262" text-anchor="middle" font-size="12" font-style="italic">or straight from any commit</text>
    </g>
    <line x1="168" y1="133" x2="222.0" y2="133.0" stroke="#2b3a4a" stroke-width="2"/><polygon points="232,133 222.0,138.0 222.0,128.0" fill="#2b3a4a"/>
    <text x="350" y="34" font-size="15" font-weight="bold" text-anchor="middle">Parse once</text>
    <rect x="240" y="50" width="220" height="166" rx="10" fill="#dfe6ec" stroke="#2b3a4a"/>
    <g font-size="13" text-anchor="middle">
      <text x="350" y="82">data-oriented tables</text>
      <text x="350" y="104">keyed by content hash</text>
      <text x="350" y="138" font-weight="bold">content-addressed store</text>
      <text x="350" y="160">shared by every worktree</text>
      <text x="350" y="194">nothing is parsed twice</text>
    </g>
    <line x1="468" y1="133" x2="522.0" y2="133.0" stroke="#2b3a4a" stroke-width="2"/><polygon points="532,133 522.0,138.0 522.0,128.0" fill="#2b3a4a"/>
    <text x="620" y="34" font-size="15" font-weight="bold" text-anchor="middle">Codecs</text>
    <g font-size="13">
      <rect x="540" y="50" width="160" height="34" rx="6" fill="#d5e8d4" stroke="#2b3a4a"/>
      <text x="620" y="72" text-anchor="middle">code generation</text>
      <rect x="540" y="94" width="160" height="34" rx="6" fill="#d5e8d4" stroke="#2b3a4a"/>
      <text x="620" y="116" text-anchor="middle">gates</text>
      <rect x="540" y="138" width="160" height="34" rx="6" fill="#d5e8d4" stroke="#2b3a4a"/>
      <text x="620" y="160" text-anchor="middle">tangle and inventories</text>
      <rect x="540" y="182" width="160" height="34" rx="6" fill="#d5e8d4" stroke="#2b3a4a" stroke-dasharray="5 4"/>
      <text x="620" y="204" text-anchor="middle">HTML export, analysis</text>
      <text x="620" y="246" text-anchor="middle" font-size="12" font-style="italic">only codecs whose inputs</text>
      <text x="620" y="262" text-anchor="middle" font-size="12" font-style="italic">changed run again</text>
    </g>
    <line x1="708" y1="100" x2="742.9" y2="84.1" stroke="#2b3a4a" stroke-width="2"/><polygon points="752,80 745.0,88.7 740.8,79.6" fill="#2b3a4a"/>
    <line x1="708" y1="166" x2="742.9" y2="181.9" stroke="#2b3a4a" stroke-width="2"/><polygon points="752,186 740.8,186.4 745.0,177.3" fill="#2b3a4a"/>
    <g font-size="13" text-anchor="middle">
      <rect x="758" y="56" width="90" height="46" rx="6" fill="#fbe5d6" stroke="#2b3a4a"/>
      <text x="803" y="76">files</text>
      <text x="803" y="94" font-size="11">changed only</text>
      <rect x="758" y="164" width="90" height="46" rx="6" fill="#fbe5d6" stroke="#2b3a4a"/>
      <text x="803" y="184">findings</text>
      <text x="803" y="202" font-size="11">with the fix</text>
    </g>
  </g>
</svg>
