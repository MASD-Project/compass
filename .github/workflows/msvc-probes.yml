# yamllint disable rule:line-length
---
name: MSVC probes

# Probes compile generated sources with MSVC to measure where its limits
# fire. They are experiments, run by hand: workflow_dispatch only.
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      only:
        description: 'Probe names to run, space-separated; empty runs all'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  c1202:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Report the compiler
        shell: pwsh
        run: cl.exe 2>&1 | Select-Object -First 1

      - name: Run the C1202 probes
        shell: pwsh
        env:
          ONLY: ${{ inputs.only }}
        run: |
          $only = @()
          if ($env:ONLY) { $only = @('--only') + $env:ONLY.Split(' ') }
          python build/probes/msvc_c1202/probe.py --out probes-out @only

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msvc-c1202-probes
          path: probes-out/results.tsv
